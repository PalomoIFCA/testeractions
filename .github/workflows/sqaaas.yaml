on: [push]
jobs:
  sqaaas_job:
    runs-on: ubuntu-latest
    name: Job that triggers SQAaaS platform branch
    steps:
      - name: SQAaaS action step
        uses: eosc-synergy/sqaaas-assessment-action@feature/only_criteria_workflow
        with: 
           criteria_workflow_only: 'True'
           explicit_criteria_workflow: '{"criteria_workflow":[{"id":"QC.Sty","tools":[{"name":"find_oph_workflows.py"},{"args":[{"value": "./", "option": "--path","description":"path to evaluate","type": "optional"}]},{"docker":{"dockerfile":"QC.Sty/pyophidia/Dockerfile"},"reporting":{"validator":"pyophidia","subcriterion":"QC.Sty","requirement_level":"RECOMMENDED","lang_name":"python","tool_name":"find_oph_workflows.py"},"name":"find_oph_workflows.py"}]}]}'

      
      

